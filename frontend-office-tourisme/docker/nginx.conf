server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  client_max_body_size 16k;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/css application/javascript text/javascript image/svg+xml application/json text/plain;

  include /etc/nginx/snippets/security-headers.conf;

  if ($request_method !~ ^(GET|HEAD)$) {
    return 405;
  }

  location = /health {
    access_log off;
    default_type text/plain;
    return 200 "ok";
  }

  location = /.well-known/security.txt {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=86400" always;
    default_type text/plain;
    try_files $uri =404;
  }

  location ~ /\.(?!well-known) {
    return 404;
  }

  location ~* \.(?:css|js|mjs)$ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800" always;
    try_files $uri =404;
  }

  location ~* \.(?:jpg|jpeg|png|webp|avif|svg|ico|woff2)$ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=2592000" always;
    try_files $uri =404;
  }

  location ~* \.html$ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ =404;
  }

  error_page 404 /404.html;
}
