name: blocklucky

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs:
    - /tmp:size=64m

x-backend-env: &backend-env
  NODE_ENV: production
  DATABASE_URL: postgresql://etherbay_admin:etherbay_password@postgres:5432/blocklucky_db?schema=public
  REDIS_URL: redis://redis:6379
  BLOCKCHAIN_MODE: onchain
  RPC_URL: http://blockchain:8545
  CHAIN_ID: 31337
  LOTTERY_CONTRACT_ADDRESS: 0xCf7Ed3AccA5a467e9e704C703E8D87F634fB0Fc9
  POAP_CONTRACT_ADDRESS: 0x5FC8d32690cc91D4c39d9d3abcBD16989F875707
  SMTP_HOST: mailpit
  SMTP_PORT: 1025
  FRONTEND_URL: http://localhost:3000
  CORS_ORIGINS: http://localhost:3000,http://localhost:8081
  METRICS_TOKEN: ${METRICS_TOKEN:-}
  JWT_SECRET: ${JWT_SECRET:-}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
  RELAYER_PRIVATE_KEY: ${RELAYER_PRIVATE_KEY:-}
  WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}

services:
  postgres:
    image: postgres:15-alpine
    container_name: blocklucky_postgres
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
      - -c
      - log_min_duration_statement=500
      - -c
      - log_lock_waits=on
      - -c
      - idle_in_transaction_session_timeout=60000
      - -c
      - max_connections=100
    environment:
      POSTGRES_USER: etherbay_admin
      POSTGRES_PASSWORD: etherbay_password
      POSTGRES_DB: blocklucky_db
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U etherbay_admin -d blocklucky_db"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    container_name: blocklucky_redis
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - noeviction
      - --slowlog-log-slower-than
      - "10000"
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.31.4
    container_name: blocklucky_mailpit
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 15s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  blockchain:
    build:
      context: ./smart-contract
    container_name: blocklucky_blockchain
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      OPERATOR_PRIVATE_KEY: ${RELAYER_PRIVATE_KEY:-}
      POAP_BASE_URI: http://localhost:2053/api/v1/lottery/poap/
    ports:
      - "127.0.0.1:8545:8545"
    restart: unless-stopped

  migrate:
    profiles: ["app"]
    <<: *hardening
    build:
      context: ./backend
      target: migrator
    environment:
      DATABASE_URL: postgresql://etherbay_admin:etherbay_password@postgres:5432/blocklucky_db?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    profiles: ["app"]
    <<: *hardening
    build:
      context: ./backend
      target: runtime
    environment:
      <<: *backend-env
      RUN_WORKERS: "false"
    ports:
      - "2053:2053"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      blockchain:
        condition: service_healthy
    stop_grace_period: 30s
    restart: unless-stopped

  worker:
    profiles: ["app"]
    <<: *hardening
    build:
      context: ./backend
      target: runtime
    command: ["node", "--max-old-space-size=384", "--enable-source-maps", "dist/src/worker.js"]
    environment:
      <<: *backend-env
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:2054/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 3s
      retries: 3
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      blockchain:
        condition: service_healthy
    stop_grace_period: 30s
    restart: unless-stopped

  web:
    profiles: ["app"]
    <<: *hardening
    tmpfs:
      - /tmp:size=64m
      - /app/.next/cache:size=128m,uid=1000,gid=1000
    build:
      context: ./frontend-web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:2053/api
        NEXT_PUBLIC_WS_URL: http://localhost:2053
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  tourisme:
    profiles: ["app"]
    <<: *hardening
    build:
      context: ./frontend-office-tourisme
    ports:
      - "4000:8080"
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:

networks:
  default:
    ipam:
      driver: default
      config:
        - subnet: 172.40.0.0/16
