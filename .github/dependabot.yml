version: 2
updates:
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      default-days: 5
    groups:
      backend-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /smart-contract
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      default-days: 5
    groups:
      contracts-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /documentation-officielle
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    cooldown:
      default-days: 5
    groups:
      documentation:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /frontend-web
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      default-days: 5
    groups:
      web-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /mobile-app
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      default-days: 5
    ignore:
      - dependency-name: expo*
        update-types: [version-update:semver-major]
      - dependency-name: react-native*
        update-types: [version-update:semver-major]
    groups:
      mobile-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directories: [/backend, /frontend-web, /frontend-office-tourisme, /smart-contract]
    schedule:
      interval: weekly
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
