name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Détection des projets modifiés
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      contracts: ${{ steps.filter.outputs.contracts }}
      web: ${{ steps.filter.outputs.web }}
      mobile: ${{ steps.filter.outputs.mobile }}
      tourisme: ${{ steps.filter.outputs.tourisme }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            contracts:
              - 'smart-contract/**'
              - '.github/workflows/ci.yml'
            web:
              - 'frontend-web/**'
              - '.github/workflows/ci.yml'
            mobile:
              - 'mobile-app/**'
              - '.github/workflows/ci.yml'
            tourisme:
              - 'frontend-office-tourisme/**'
              - '.github/workflows/ci.yml'
            infra:
              - 'docker-compose.yml'
              - 'docker/**'
              - '**/Dockerfile'
              - '.github/workflows/ci.yml'

  secrets:
    name: Recherche de secrets (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Historique Git complet
        run: >-
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1
          git /repo --no-banner --redact --config /repo/.gitleaks.toml

  documentation:
    name: Documentation officielle (génération, liens, fraîcheur)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: documentation-officielle
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: documentation-officielle/package-lock.json
      - run: npm ci
      - name: Pages générées depuis le code à jour, liens et ancres valides, descriptions complètes
        run: npm run check

  backend:
    name: Backend (typecheck, lint, tests, migrations)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: blocklucky_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d blocklucky_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/blocklucky_ci?schema=public
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Vulnérabilités hautes et critiques des dépendances de production
        run: npm audit --omit=dev --audit-level=high
      - run: npx prisma generate
      - name: Synchronisation de .env.example avec le schéma de configuration
        run: npm run env:check
      - run: npm run typecheck
      - run: npm run lint
      - name: Migrations appliquées sur une base vierge
        run: npx prisma migrate deploy
      - name: Absence de dérive entre le schéma Prisma et les migrations
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      - run: npm test -- --ci
      - run: npm run compile

  contracts:
    name: Smart contracts (lint, tests, couverture, Slither)
    needs: changes
    if: needs.changes.outputs.contracts == 'true' || needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: smart-contract
    env:
      HARDHAT_DISABLE_TELEMETRY: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: smart-contract/package-lock.json
      - run: npm ci
      - name: Vulnérabilités critiques des dépendances des contrats (voir ADR 0004)
        run: npm audit --omit=dev --audit-level=critical
      - run: npm run typecheck
      - name: Règles Solidity (solhint, zéro avertissement)
        run: npm run lint
      - name: Tests unitaires, fuzzing et couverture
        run: npm run test:coverage
      - name: Couverture des lignes des contrats de production à 100 %
        run: npm run coverage:check
      - name: ABI embarquées par le backend à jour
        run: node scripts/export-abi.mjs --check
      - name: Analyse statique (Slither, échec dès le niveau Medium)
        run: npm run slither

  chain:
    name: Intégration backend sur une vraie blockchain locale
    needs: [changes, contracts, backend]
    if: >-
      always() && !failure() && !cancelled() &&
      (needs.changes.outputs.contracts == 'true' || needs.changes.outputs.backend == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: blocklucky_chain
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d blocklucky_chain"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/blocklucky_chain?schema=public
      REDIS_URL: redis://localhost:6379
      RPC_URL: http://127.0.0.1:8545
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Nœud Hardhat, contrats déployés et oracle VRF local
        working-directory: smart-contract
        run: |
          docker build -t blocklucky-chain:ci .
          docker run -d --name blocklucky-chain -p 8545:8545 blocklucky-chain:ci
          for _ in $(seq 1 60); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' blocklucky-chain)" = healthy ] && exit 0
            sleep 3
          done
          docker logs blocklucky-chain
          exit 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - name: Achat, cadeau, tirage VRF, versement de la cagnotte et disjoncteur sur la chaîne
        run: npm run test:chain -- --ci
      - name: Journaux du nœud en cas d'échec
        if: failure()
        run: docker logs blocklucky-chain

  web:
    name: Frontend web (lint, typecheck, tests, build)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend-web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend-web/package-lock.json
      - run: npm ci
      - name: Vulnérabilités hautes et critiques des dépendances de production
        run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: frontend-web/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('frontend-web/package-lock.json') }}-${{ hashFiles('frontend-web/src/**') }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('frontend-web/package-lock.json') }}-
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
      - name: Aucun secret ni source map dans le bundle public
        run: |
          if grep -rElq "sk_live_|AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY|0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80" .next/static; then
            echo "Secret détecté dans .next/static" && exit 1
          fi
          if find .next/static -name '*.map' | grep -q .; then
            echo "Source map publique détectée" && exit 1
          fi

  mobile:
    name: Application mobile (typecheck, lint)
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json
      - run: npm ci
      - name: Vulnérabilités hautes et critiques des dépendances de production
        run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm run lint
      - name: Vérification de la configuration Expo
        run: npx expo config --type public > /dev/null

  tourisme:
    name: Site Office de Tourisme (syntaxe et liens)
    needs: changes
    if: needs.changes.outputs.tourisme == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: frontend-office-tourisme
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - name: Syntaxe des modules JavaScript
        run: find assets/js \( -name '*.js' -o -name '*.mjs' \) -exec node --check {} \;
      - name: Ressources locales référencées par les pages HTML
        run: node ../.github/scripts/check-static-links.mjs .

  docker:
    name: Images Docker et Compose
    needs: [changes, backend, contracts, web, tourisme]
    if: >-
      always() && !failure() && !cancelled() &&
      (needs.changes.outputs.infra == 'true' || needs.changes.outputs.backend == 'true' ||
       needs.changes.outputs.contracts == 'true' || needs.changes.outputs.web == 'true' ||
       needs.changes.outputs.tourisme == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Validation de docker-compose.yml
        run: docker compose --profile app config -q
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Image backend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: backend
          target: runtime
          push: false
          tags: blocklucky-backend:${{ github.sha }}
          load: true
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Image frontend web
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: frontend-web
          push: false
          tags: blocklucky-web:${{ github.sha }}
          load: true
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Image blockchain locale
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: smart-contract
          push: false
          tags: blocklucky-blockchain:${{ github.sha }}
          load: true
          cache-from: type=gha,scope=blockchain
          cache-to: type=gha,mode=max,scope=blockchain
      - name: Image Office de Tourisme
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: frontend-office-tourisme
          push: false
          tags: blocklucky-tourisme:${{ github.sha }}
          load: true
          cache-from: type=gha,scope=tourisme
          cache-to: type=gha,mode=max,scope=tourisme
      - name: Vulnérabilités des images (Trivy)
        run: |
          for image in blocklucky-backend blocklucky-web blocklucky-tourisme; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.76.2 image \
              --quiet --exit-code 1 --ignore-unfixed --severity CRITICAL,HIGH "$image:${{ github.sha }}"
          done
